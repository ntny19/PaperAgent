<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperAgent</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1c1c1a;--muted:#6b6b66;--line:#e2e1dc;--accent:#2b5fd9;--user:#e8eefc;--warn:#fff4d6;--warnb:#e0a800;--bad:#b3261e;--code:#f0efea}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--ink:#ecebe6;--muted:#9a9990;--line:#33332f;--accent:#7aa2ff;--user:#252d44;--warn:#3a3118;--warnb:#b88a00;--bad:#ff8a80;--code:#2a2a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0 8px 0 0}
select,button,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:var(--bad)}
.grow{flex:1}.muted{color:var(--muted);font-size:13px}
#banner{display:none;margin:10px 16px 0;padding:10px 12px;background:var(--warn);border:1px solid var(--warnb);border-radius:8px;font-size:13px}
#banner pre{margin:6px 0 0;white-space:pre-wrap;font-size:12px}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:900px;width:100%;margin:0 auto;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere}
.m.user{background:var(--user);border-color:transparent}
.m pre{background:var(--code);padding:8px 10px;border-radius:8px;overflow:auto;font-size:13px;white-space:pre-wrap}
.m code{background:var(--code);padding:1px 4px;border-radius:4px;font-size:13px}
.m pre code{padding:0;background:none}
details.tool{max-width:900px;width:100%;margin:0 auto;font-size:13px;color:var(--muted)}
details.tool pre{background:var(--code);padding:8px;border-radius:8px;overflow:auto;max-height:240px;white-space:pre-wrap;color:var(--ink)}
.status{max-width:900px;width:100%;margin:0 auto;color:var(--muted);font-size:13px}
.appr{max-width:900px;width:100%;margin:0 auto;border:2px solid var(--accent);border-radius:12px;padding:12px;background:var(--panel)}
.appr .warn{background:var(--warn);border:1px solid var(--warnb);border-radius:8px;padding:8px;margin:8px 0;font-size:13px;white-space:pre-wrap}
.appr pre{background:var(--code);padding:8px;border-radius:8px;overflow:auto;max-height:260px;white-space:pre-wrap;font-size:13px}
.appr .row{display:flex;gap:8px;margin-top:8px}
.out{max-height:260px;overflow:auto}
footer{padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
.inp{max-width:900px;margin:0 auto;display:flex;gap:8px}
textarea{flex:1;resize:none;height:56px}
@media (max-width:640px){header h1{width:100%}}
</style>
</head>
<body>
<header>
  <h1>PaperAgent</h1>
  <label class="muted">Model <select id="model"></select></label>
  <label class="muted">Workspace <select id="ws"></select></label>
  <span class="grow"></span>
  <span class="muted" id="idx"></span>
  <button id="reindex" title="Re-scan the papers folder now">Re-index</button>
  <button id="reset" title="Start a new conversation">New chat</button>
</header>
<div id="banner"></div>
<div id="msgs"></div>
<footer>
  <div class="inp">
    <textarea id="box" placeholder="Ask about your papers, or pick a workspace and ask for help reproducing it...  (Enter = send, Shift+Enter = newline)"></textarea>
    <button id="send" class="primary">Send</button>
    <button id="stop" class="danger" style="display:none">Stop</button>
  </div>
</footer>
<script>
const $=id=>document.getElementById(id);
const msgs=$('msgs');let ws,busy=false,statusEl=null,outEl=null;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(s){
  s=esc(s);
  s=s.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>'<pre><code>'+c+'</code></pre>');
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/^### (.*)$/gm,'<b>$1</b>').replace(/^## (.*)$/gm,'<b>$1</b>').replace(/^# (.*)$/gm,'<b>$1</b>');
  return s.replace(/\n/g,'<br>').replace(/(<\/pre>)<br>/g,'$1').replace(/<br>(<pre>)/g,'$1');
}
function add(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
function setBusy(b){busy=b;$('send').style.display=b?'none':'';$('stop').style.display=b?'':'none';if(!b&&statusEl){statusEl.remove();statusEl=null}}
function connect(){
  ws=new WebSocket('ws://'+location.host+'/ws');
  ws.onclose=()=>{setTimeout(connect,1500)};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='status'){if(!statusEl)statusEl=add('status','');statusEl.textContent=m.text;msgs.appendChild(statusEl);msgs.scrollTop=msgs.scrollHeight}
    else if(m.type==='tool_call'){add('tool','').outerHTML;const d=document.createElement('details');d.className='tool';d.innerHTML='<summary>🔧 '+esc(m.name)+' '+esc(JSON.stringify(m.args)).slice(0,160)+'</summary>';d.dataset.open='1';msgs.lastChild.replaceWith(d);window._last=d}
    else if(m.type==='tool_result'){if(window._last){window._last.insertAdjacentHTML('beforeend','<pre>'+esc(m.text)+'</pre>')}}
    else if(m.type==='cmd_output'){if(!outEl||!outEl.isConnected){outEl=add('appr out','<pre></pre>');outEl.style.borderColor='var(--line)'}outEl.firstChild.textContent+=m.text;outEl.scrollTop=outEl.scrollHeight}
    else if(m.type==='approval'){approval(m)}
    else if(m.type==='final'){add('m',md(m.text));outEl=null;setBusy(false)}
    else if(m.type==='error'){add('m','<b style="color:var(--bad)">Error</b><br>'+esc(m.text));setBusy(false)}
  };
}
function approval(m){
  const w=m.warnings&&m.warnings.length?'<div class="warn">⚠️ '+m.warnings.map(esc).join('<br><br>')+'</div>':'';
  const d=add('appr','<b>'+(m.kind==='command'?'▶ Approve this command?':'✎ Approve this edit?')+'</b> <span class="muted">'+esc(m.title)+'</span>'+w+'<pre>'+esc(m.body)+'</pre><div class="row"><button class="primary">Approve</button><button class="danger">Deny</button></div>');
  const [a,b]=d.querySelectorAll('button');
  const done=ok=>{ws.send(JSON.stringify({type:'approval',id:m.id,approved:ok}));d.querySelector('.row').innerHTML='<span class="muted">'+(ok?'✅ approved':'⛔ denied')+'</span>';outEl=null};
  a.onclick=()=>done(true);b.onclick=()=>done(false);
}
function send(){
  const t=$('box').value.trim();if(!t||busy)return;
  add('m user',md(t));$('box').value='';setBusy(true);
  ws.send(JSON.stringify({type:'chat',text:t,model:$('model').value,workspace:$('ws').value}));
}
async function loadState(){
  const s=await (await fetch('/api/state')).json();
  const catalog=JSON.stringify(s.models);
  if($('model').dataset.catalog!==catalog){
    const selected=$('model').value||localStorage.pa_model||s.default_model;
    $('model').replaceChildren();
    s.models.forEach(m=>$('model').add(new Option(m.label,m.id)));
    $('model').value=s.models.some(m=>m.id===selected)?selected:s.default_model;
    localStorage.pa_model=$('model').value;
    $('model').dataset.catalog=catalog;
  }
  if(!$('ws').options.length){
    $('ws').add(new Option('(none - papers only)',''));
    s.workspaces.forEach(w=>$('ws').add(new Option(w.name+(w.exists?'':' (missing)'),w.name)));$('ws').value=localStorage.pa_ws||'';
    if($('ws').value)checkWs();
  }
  const i=s.index;let t=s.papers+' papers';
  if(i.state==='indexing'||i.state==='scanning')t+=' · indexing '+i.done+'/'+i.total;
  else if(i.state==='embedding')t+=' · embedding '+i.done+'/'+i.total;
  else if(i.embeddings===false)t+=' · keyword search only';
  $('idx').textContent=t;$('idx').title=i.error||'';
}
async function checkWs(){
  const b=$('banner');b.style.display='none';const w=$('ws').value;if(!w)return;
  const r=await fetch('/api/scan?workspace='+encodeURIComponent(w));if(!r.ok)return;const s=await r.json();
  const risky=s.hits.filter(h=>h.risk!=='OK');
  if(risky.length){b.style.display='block';b.innerHTML='⚠️ <b>'+risky.length+' secret finding(s) in '+esc(w)+' that git could commit</b> — move keys to a git-ignored .env and rotate if ever pushed.<pre>'+
    esc(risky.slice(0,10).map(h=>h.file+(h.line?':'+h.line:'')+'  '+h.rule+'  ['+h.status+']').join('\n'))+'</pre>'}
}
$('send').onclick=send;$('stop').onclick=()=>ws.send(JSON.stringify({type:'stop'}));
$('box').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('reindex').onclick=()=>fetch('/api/reindex',{method:'POST'}).then(loadState);
$('reset').onclick=()=>{ws.send(JSON.stringify({type:'reset'}));msgs.innerHTML=''};
$('model').onchange=()=>localStorage.pa_model=$('model').value;
$('ws').onchange=()=>{localStorage.pa_ws=$('ws').value;checkWs()};
connect();loadState();setInterval(loadState,3000);
</script>
</body>
</html>
